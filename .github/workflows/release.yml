name: Release Clipboard Pro

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Publish application
        shell: pwsh
        run: dotnet publish src/ClipboardPro/ClipboardPro.csproj -c Release -r win-x64 --self-contained false -o src/ClipboardPro/bin/Release/net8.0-windows/win-x64/publish
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ClipboardPro.iss'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/ClipboardPro-Setup.exe
